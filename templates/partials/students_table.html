<table>
  <thead>
    <tr>
      <th>id</th>
      <th>dni</th>
      <th>name</th>
      <th>age</th>
      <th>grade</th>
      <th>is_approved</th>
    </tr>
  </thead>
  <tbody>
    {% for student in students %}
    <tr>
      <td>{{ student.id }}</td>
      <td>{{ student.dni }}</td>
      <td>{{ student.name }}</td>
      <td>{{ student.age }}</td>
      <td>{{ student.grade }}</td>
      <td>{{ student.is_approved }}</td>
    </tr>
    {% else %}
    <tr>
      <td colspan="6">No hay estudiantes registrados</td>
    </tr>
    {% endfor %}
  </tbody>
</table>
